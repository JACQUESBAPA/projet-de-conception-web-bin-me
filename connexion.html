<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running - Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            margin-top: 50px;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            width: 300px;
            margin: 0 auto;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            width: 100%;
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: darkgreen;
        }
        .link {
            margin-top: 20px;
        }
        .link a {
            text-decoration: none;
            color: #000;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Logo fitness.png" alt="Fitness Club Logo" class="logo">
        <h1>RUNNING</h1>
        <form action="login.php" method="post">
            <label for="identifiant">Identifiant :</label>
            <input type="text" id="identifiant" name="identifiant" placeholder="prenom.nom@groupe-esigelec.org" required>
            
            <label for="password">Mot de Passe :</label>
            <input type="password" id="password" name="password" placeholder="mon_mot_de_passe" required>
            
            <input type="submit" value="Se connecter">
        </form>
        <div class="link">
            <a href="#">Créer un compte</a>
        </div>
        <div class="link">
            <a href="#">← Retour vers le site</a>
        </div>
    </div>

</body>
</html>
