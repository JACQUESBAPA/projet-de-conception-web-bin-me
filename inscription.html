<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Running</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
        h1, h2 {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            width: 140px;
            text-align: right;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        input[type="submit"] {
            background-color: #00ff00;
            color: black;
            border: 1px solid black;
            padding: 5px 10px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #00cc00;
        }
        .back-link {
            margin-top: 20px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 10px;">
        <img src="Logo fitness.png" alt="Logo" width="100">
        <h2>RUNNING</h2>
    </div>

    <h1>Inscription</h1>

    <form action="#" method="post">
        <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" value="Malado">
        </div>
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" value="SOW">
        </div>
        <div>
            <label for="email">Adresse email :</label>
            <input type="email" id="email" name="email" value="prenom.nom@groupe-esigelec.org">
        </div>
        <div>
            <label for="password">Mot de Passe :</label>
            <input type="password" id="password" name="password" value="mon_mot_de_passe">
        </div>
        <div>
            <label for="confirm_password">Confirmation Mot de Passe :</label>
            <input type="password" id="confirm_password" name="confirm_password" value="mon_mot_de_passe">
        </div>
        <input type="submit" value="S'inscrire">
    </form>

    <a href="#" class="back-link">← Retour vers le site</a>
</div>

</body>
</html>
